<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1250" width="1300" height="1250" font-family="Segoe UI, Roboto, 'Noto Sans', Helvetica, Arial, sans-serif"><defs><marker id="m455A64" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#455A64"/></marker><marker id="m2E7D32" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="m90A4AE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#90A4AE"/></marker><marker id="m8E24AA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8E24AA"/></marker></defs><rect width="1300" height="1250" fill="#FFFFFF"/><text x="30" y="38" font-size="22" font-weight="bold" fill="#1A1A1A" text-anchor="start" >Chi tiết CNN phễu–loa (U-Net) — nhánh ĐƯỜNG NÉT</text><text x="30" y="62" font-size="14" font-weight="normal" fill="#607D8B" text-anchor="start" >kênh sáng Y · ảnh 256 × 256 · 626.169 tham số · shape ghi theo [kênh × cao × rộng]</text><rect x="70" y="82" width="300" height="50" rx="8" fill="#F5F5F5" stroke="#616161" stroke-width="2"/><text x="220.0" y="102.5" font-size="15" font-weight="bold" fill="#1A1A1A" text-anchor="middle" >Vào: Y ảnh mờ + độ sáng nền</text><text x="220.0" y="120.5" font-size="13" font-weight="normal" fill="#37474F" text-anchor="middle" >[2 × 256 × 256]</text><rect x="70" y="160" width="300" height="50" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/><text x="220.0" y="180.5" font-size="15" font-weight="bold" fill="#1A1A1A" text-anchor="middle" >stem: conv 3×3 + ReLU</text><text x="220.0" y="198.5" font-size="13" font-weight="normal" fill="#37474F" text-anchor="middle" >→ [16 × 256 × 256]</text><path d="M 130 132 L 130 160" fill="none" stroke="#455A64" stroke-width="2" marker-end="url(#m455A64)"/><path d="M 130 210 L 130 244.0" fill="none" stroke="#455A64" stroke-width="2" marker-end="url(#m455A64)"/><rect x="930" y="82" width="300" height="50" rx="8" fill="#E0F2F1" stroke="#00897B" stroke-width="2"/><text x="1080.0" y="102.5" font-size="15" font-weight="bold" fill="#1A1A1A" text-anchor="middle" >Ra: chi tiết Y = chi tiết Y ảnh mờ + Δ</text><text x="1080.0" y="120.5" font-size="13" font-weight="normal" fill="#37474F" text-anchor="middle" >[1 × 256 × 256] · mọi cạnh</text><rect x="930" y="160" width="300" height="50" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/><text x="1080.0" y="180.5" font-size="15" font-weight="bold" fill="#1A1A1A" text-anchor="middle" >tail: conv 3×3 (khởi tạo 0)</text><text x="1080.0" y="198.5" font-size="13" font-weight="normal" fill="#37474F" text-anchor="middle" >→ Δ [1 × 256 × 256]</text><path d="M 1170 160 L 1170 132" fill="none" stroke="#455A64" stroke-width="2" marker-end="url(#m455A64)"/><path d="M 1170 244.0 L 1170 210" fill="none" stroke="#455A64" stroke-width="2" marker-end="url(#m455A64)"/><rect x="70" y="244.0" width="300" height="62" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/><text x="220.0" y="270.5" font-size="15" font-weight="bold" fill="#1A1A1A" text-anchor="middle" >Khối residual · tầng 256²</text><text x="220.0" y="288.5" font-size="13" font-weight="normal" fill="#37474F" text-anchor="middle" >[16 × 256 × 256] · vùng nhìn 7 px</text><rect x="930" y="244.0" width="300" height="62" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/><text x="1080.0" y="270.5" font-size="15" font-weight="bold" fill="#1A1A1A" text-anchor="middle" >conv 3×3 + ReLU → khối residual</text><text x="1080.0" y="288.5" font-size="13" font-weight="normal" fill="#37474F" text-anchor="middle" >[16 × 256 × 256]</text><circle cx="896" cy="275" r="15" fill="#FFFFFF" stroke="#455A64" stroke-width="2"/><text x="896" y="280" font-size="11" font-weight="bold" fill="#455A64" text-anchor="middle" >nối</text><path d="M 911 275 L 930 275" fill="none" stroke="#455A64" stroke-width="2" marker-end="url(#m455A64)"/><path d="M 370 275 L 881 275" fill="none" stroke="#90A4AE" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#m90A4AE)"/><text x="633.0" y="267" font-size="12" font-weight="normal" fill="#78909C" text-anchor="middle" font-style="italic">skip · đặc trưng tầng 256²</text><path d="M 130 306.0 L 130 405 L 120 405" fill="none" stroke="#2E7D32" stroke-width="2" marker-end="url(#m2E7D32)"/><text x="138" y="328.0" font-size="12" font-weight="normal" fill="#2E7D32" text-anchor="start" font-style="italic">↓ conv 4×4 bước 2 + ReLU → [24 × 128²]</text><path d="M 1120 374.0 L 1120 323 L 896 323 L 896 290" fill="none" stroke="#2E7D32" stroke-width="2" marker-end="url(#m2E7D32)"/><text x="904" y="341" font-size="12" font-weight="normal" fill="#2E7D32" text-anchor="start" font-style="italic">↑ pixel shuffle ×2 → [16 × 256²]</text><rect x="120" y="374.0" width="300" height="62" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/><text x="270.0" y="400.5" font-size="15" font-weight="bold" fill="#1A1A1A" text-anchor="middle" >Khối residual · tầng 128²</text><text x="270.0" y="418.5" font-size="13" font-weight="normal" fill="#37474F" text-anchor="middle" >[24 × 128 × 128] · vùng nhìn 18 px</text><rect x="880" y="374.0" width="300" height="62" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/><text x="1030.0" y="400.5" font-size="15" font-weight="bold" fill="#1A1A1A" text-anchor="middle" >conv 3×3 + ReLU → khối residual</text><text x="1030.0" y="418.5" font-size="13" font-weight="normal" fill="#37474F" text-anchor="middle" >[24 × 128 × 128]</text><circle cx="846" cy="405" r="15" fill="#FFFFFF" stroke="#455A64" stroke-width="2"/><text x="846" y="410" font-size="11" font-weight="bold" fill="#455A64" text-anchor="middle" >nối</text><path d="M 861 405 L 880 405" fill="none" stroke="#455A64" stroke-width="2" marker-end="url(#m455A64)"/><path d="M 420 405 L 831 405" fill="none" stroke="#90A4AE" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#m90A4AE)"/><text x="633.0" y="397" font-size="12" font-weight="normal" fill="#78909C" text-anchor="middle" font-style="italic">skip · đặc trưng tầng 128²</text><path d="M 180 436.0 L 180 525 L 170 525" fill="none" stroke="#2E7D32" stroke-width="2" marker-end="url(#m2E7D32)"/><text x="188" y="458.0" font-size="12" font-weight="normal" fill="#2E7D32" text-anchor="start" font-style="italic">↓ conv 4×4 bước 2 + ReLU → [32 × 64²]</text><path d="M 1070 494.0 L 1070 453 L 846 453 L 846 420" fill="none" stroke="#2E7D32" stroke-width="2" marker-end="url(#m2E7D32)"/><text x="854" y="471" font-size="12" font-weight="normal" fill="#2E7D32" text-anchor="start" font-style="italic">↑ pixel shuffle ×2 → [24 × 128²]</text><rect x="170" y="494.0" width="300" height="62" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/><text x="320.0" y="520.5" font-size="15" font-weight="bold" fill="#1A1A1A" text-anchor="middle" >Khối residual · tầng 64²</text><text x="320.0" y="538.5" font-size="13" font-weight="normal" fill="#37474F" text-anchor="middle" >[32 × 64 × 64] · vùng nhìn 40 px</text><rect x="830" y="494.0" width="300" height="62" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/><text x="980.0" y="520.5" font-size="15" font-weight="bold" fill="#1A1A1A" text-anchor="middle" >conv 3×3 + ReLU → khối residual</text><text x="980.0" y="538.5" font-size="13" font-weight="normal" fill="#37474F" text-anchor="middle" >[32 × 64 × 64]</text><circle cx="796" cy="525" r="15" fill="#FFFFFF" stroke="#455A64" stroke-width="2"/><text x="796" y="530" font-size="11" font-weight="bold" fill="#455A64" text-anchor="middle" >nối</text><path d="M 811 525 L 830 525" fill="none" stroke="#455A64" stroke-width="2" marker-end="url(#m455A64)"/><path d="M 470 525 L 781 525" fill="none" stroke="#90A4AE" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#m90A4AE)"/><text x="633.0" y="517" font-size="12" font-weight="normal" fill="#78909C" text-anchor="middle" font-style="italic">skip · đặc trưng tầng 64²</text><path d="M 230 556.0 L 230 635 L 220 635" fill="none" stroke="#2E7D32" stroke-width="2" marker-end="url(#m2E7D32)"/><text x="238" y="578.0" font-size="12" font-weight="normal" fill="#2E7D32" text-anchor="start" font-style="italic">↓ conv 4×4 bước 2 + ReLU → [48 × 32²]</text><path d="M 1020 604.0 L 1020 573 L 796 573 L 796 540" fill="none" stroke="#2E7D32" stroke-width="2" marker-end="url(#m2E7D32)"/><text x="804" y="591" font-size="12" font-weight="normal" fill="#2E7D32" text-anchor="start" font-style="italic">↑ pixel shuffle ×2 → [32 × 64²]</text><rect x="220" y="604.0" width="300" height="62" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/><text x="370.0" y="630.5" font-size="15" font-weight="bold" fill="#1A1A1A" text-anchor="middle" >Khối residual · tầng 32²</text><text x="370.0" y="648.5" font-size="13" font-weight="normal" fill="#37474F" text-anchor="middle" >[48 × 32 × 32] · vùng nhìn 84 px</text><rect x="780" y="604.0" width="300" height="62" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/><text x="930.0" y="630.5" font-size="15" font-weight="bold" fill="#1A1A1A" text-anchor="middle" >conv 3×3 + ReLU → khối residual</text><text x="930.0" y="648.5" font-size="13" font-weight="normal" fill="#37474F" text-anchor="middle" >[48 × 32 × 32]</text><circle cx="746" cy="635" r="15" fill="#FFFFFF" stroke="#455A64" stroke-width="2"/><text x="746" y="640" font-size="11" font-weight="bold" fill="#455A64" text-anchor="middle" >nối</text><path d="M 761 635 L 780 635" fill="none" stroke="#455A64" stroke-width="2" marker-end="url(#m455A64)"/><path d="M 520 635 L 731 635" fill="none" stroke="#90A4AE" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#m90A4AE)"/><text x="633.0" y="627" font-size="12" font-weight="normal" fill="#78909C" text-anchor="middle" font-style="italic">skip · đặc trưng tầng 32²</text><rect x="400" y="720" width="500" height="110" rx="8" fill="#F3E5F5" stroke="#8E24AA" stroke-width="2"/><text x="650.0" y="761.5" font-size="15" font-weight="bold" fill="#1A1A1A" text-anchor="middle" >ĐÁY 16 × 16 · vùng nhìn 204 px ≈ cả ảnh</text><text x="650.0" y="779.5" font-size="13" font-weight="normal" fill="#37474F" text-anchor="middle" >nối [56 × 16²] với ZI qua conv 1×1 (128 → 56) → [112 × 16²]</text><text x="650.0" y="797.5" font-size="13" font-weight="normal" fill="#37474F" text-anchor="middle" >conv 3×3 + ReLU → khối residual → [56 × 16 × 16]</text><path d="M 280 666.0 L 280 775.0 L 400 775.0" fill="none" stroke="#2E7D32" stroke-width="2" marker-end="url(#m2E7D32)"/><text x="288" y="688.0" font-size="12" font-weight="normal" fill="#2E7D32" text-anchor="start" font-style="italic">↓ conv 4×4 bước 2 + ReLU → [56 × 16²]</text><path d="M 900 775.0 L 1020 775.0 L 1020 666.0" fill="none" stroke="#2E7D32" stroke-width="2" marker-end="url(#m2E7D32)"/><text x="908" y="797.0" font-size="12" font-weight="normal" fill="#2E7D32" text-anchor="start" font-style="italic">↑ pixel shuffle ×2 → [48 × 32²]</text><rect x="510" y="870" width="280" height="50" rx="8" fill="#F3E5F5" stroke="#8E24AA" stroke-width="2"/><text x="650.0" y="890.5" font-size="15" font-weight="bold" fill="#1A1A1A" text-anchor="middle" >ZI · latent JEPA</text><text x="650.0" y="908.5" font-size="13" font-weight="normal" fill="#37474F" text-anchor="middle" >[128 × 16 × 16] · cùng lưới 16 × 16</text><path d="M 650 870 L 650 830" fill="none" stroke="#8E24AA" stroke-width="2.5" marker-end="url(#m8E24AA)"/><defs><linearGradient id="depth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C8E6C9"/><stop offset="1" stop-color="#6A1B9A"/></linearGradient></defs><rect x="22" y="245" width="16" height="585" rx="8" fill="url(#depth)"/><text x="30" y="237" font-size="12" font-weight="bold" fill="#2E7D32" text-anchor="middle" >NÔNG</text><text x="30" y="848" font-size="12" font-weight="bold" fill="#6A1B9A" text-anchor="middle" >SÂU</text><text x="54" y="430" font-size="11" font-weight="normal" fill="#2E7D32" text-anchor="start" transform="rotate(-90 54 430)">cạnh, chi tiết nhỏ</text><text x="54" y="820" font-size="11" font-weight="normal" fill="#6A1B9A" text-anchor="start" transform="rotate(-90 54 820)">bố cục, vật thể, độ sáng chung</text><rect x="30" y="950" width="1240" height="150" rx="10" fill="#FAFAFA" stroke="#CFD8DC"/><text x="50" y="978" font-size="15" font-weight="bold" fill="#1A1A1A" text-anchor="start" >Khối residual</text><text x="60" y="1025" font-size="14" font-weight="bold" fill="#1A1A1A" text-anchor="middle" >x</text><rect x="108" y="1004" width="84" height="32" rx="6" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/><text x="150" y="1025" font-size="13" font-weight="normal" fill="#1A1A1A" text-anchor="middle" >conv 3×3</text><rect x="208" y="1004" width="84" height="32" rx="6" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/><text x="250" y="1025" font-size="13" font-weight="normal" fill="#1A1A1A" text-anchor="middle" >ReLU</text><rect x="308" y="1004" width="84" height="32" rx="6" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/><text x="350" y="1025" font-size="13" font-weight="normal" fill="#1A1A1A" text-anchor="middle" >conv 3×3</text><circle cx="450" cy="1020" r="13" fill="#FFFFFF" stroke="#455A64" stroke-width="2"/><text x="450" y="1025" font-size="16" font-weight="bold" fill="#1A1A1A" text-anchor="middle" >+</text><text x="530" y="1025" font-size="14" font-weight="bold" fill="#1A1A1A" text-anchor="middle" >ra</text><path d="M 72 1020 L 108 1020" fill="none" stroke="#455A64" stroke-width="1.6" marker-end="url(#m455A64)"/><path d="M 192 1020 L 222 1020" fill="none" stroke="#455A64" stroke-width="1.6" marker-end="url(#m455A64)"/><path d="M 278 1020 L 308 1020" fill="none" stroke="#455A64" stroke-width="1.6" marker-end="url(#m455A64)"/><path d="M 392 1020 L 437 1020" fill="none" stroke="#455A64" stroke-width="1.6" marker-end="url(#m455A64)"/><path d="M 463 1020 L 518 1020" fill="none" stroke="#455A64" stroke-width="1.6" marker-end="url(#m455A64)"/><path d="M 60 1034 L 60 1062 L 450 1062 L 450 1033" fill="none" stroke="#90A4AE" stroke-width="1.6" marker-end="url(#m90A4AE)"/><text x="250" y="1080" font-size="12" font-weight="normal" fill="#78909C" text-anchor="middle" font-style="italic">đường tắt: cộng lại đầu vào (identity)</text><text x="610" y="988" font-size="13" font-weight="normal" fill="#37474F" text-anchor="start" >↓ PHỄU · conv 4×4 bước 2 + ReLU: ảnh nhỏ đi ½, nhiều kênh hơn, nhìn rộng hơn → đặc trưng sâu dần</text><text x="610" y="1015" font-size="13" font-weight="normal" fill="#37474F" text-anchor="start" >↑ LOA · conv 3×3 → pixel shuffle ×2 + ReLU: ảnh lớn gấp đôi, dựng lại chi tiết theo đặc trưng sâu</text><text x="610" y="1042" font-size="13" font-weight="normal" fill="#37474F" text-anchor="start" >nối (concat) với skip: đưa lại đặc trưng nông cùng tầng, để loa không mất chi tiết nhỏ</text><text x="610" y="1069" font-size="13" font-weight="normal" fill="#37474F" text-anchor="start" >tail khởi tạo 0: lúc đầu Δ = 0, đầu ra đúng bằng chi tiết Y của ảnh mờ — chỉ có thể tốt dần lên</text><rect x="30" y="1120" width="1240" height="110" rx="10" fill="#FFF3E0" stroke="#EF6C00" stroke-width="1.5"/><text x="50" y="1148" font-size="15" font-weight="bold" fill="#E65100" text-anchor="start" >Nhánh MÀU · cùng cấu trúc, chạy trên ảnh mờ thu nhỏ ½ (128 × 128) · 164.883 tham số</text><text x="50" y="1176" font-size="13" font-weight="normal" fill="#37474F" text-anchor="start" >vào [3 × 128²] → stem [12 × 128²] → phễu: 128² · 12 kênh (nhìn 14 px) → 64² · 16 (36 px) → 32² · 24 (80 px) → đáy 16² · 32 + ZI (≈ cả ảnh)</text><text x="50" y="1202" font-size="13" font-weight="normal" fill="#37474F" text-anchor="start" >→ loa ngược lại 32² → 64² → 128², nối skip mỗi tầng → tail → Δ [3 × 128²] + ảnh mờ ½ = ảnh nền màu (màu Cb, Cr và độ sáng nền)   · vùng nhìn tính theo px của ảnh 256</text></svg>