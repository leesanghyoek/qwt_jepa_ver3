pipeline_version: 3
run_kind: main
experiment_name: qwt_jepa_low_light_latent_first_v3

runtime:
  device: auto
  gpu_count: auto  # global batches unchanged: auto selects up to two visible GPUs
  output_dir: outputs/v3
  log_every_updates: 10
  checkpoint_every_updates: 250
  validation_batches: 32

data:
  root: null
  manifest_dir: null
  split_unit: trajectory
  images_per_sample: 1
  image_size: [256, 256]
  imu_window: 128
  imu_channels: [ax, ay, az, gx, gy, gz]
  num_workers: 4
  pin_memory: true
  shuffle_paired_samples: true
  shuffle_imu_rows: false
  corruption_seed: 73128
  sampler_seed: 73133
  minimum_trajectories_per_batch: 2
  train_realization_per_epoch: true
  validation_realization: 0

model:
  # Cap loc Hilbert thuc su, 14 tap, nang luong tan so am 0.0677 — thap hon 2,68
  # lan so voi tran 0.1814 ma MOI bo loc dung chung mot filter lech so nguyen deu
  # dung yen o do. Dat qwt_dualtree_db4 de chay nhanh ablation voi backend cu.
  # Doi gia tri nay LAM HONG checkpoint phase 1 cu: bieu dien dau vao thay doi.
  image_transform: qwt_dualtree_hilbert
  imu_transform: haar1d
  encoder_channels: [32, 64, 96, 128]
  embedding_dim: 128
  fusion_hidden_dim: 256
  predictor_hidden_dim: 256
  imu_summary_bins: 4
  time_metadata_dim: 3
  groupnorm_groups: 8
  gate_bias_init: -2.0

corruption:
  image:
    clean_probability: 0.02
    segment_seconds: 0.05
    exposure_gain: [0.21, 0.63]
    tone_gamma: [0.46, 0.79]
    white_balance_gain: [0.82, 1.18]
    black_level: [-0.01, 0.01]
    vignette_strength: [0.0, 0.45]
    defocus_probability: 0.68
    defocus_sigma_px: [0.30, 1.45]
    # QUYET DINH CUA NGUOI DUNG (23/09/2026): coi anh mo la do CAMERA va nhieu IMU
    # la do MOI TRUONG — hai nguyen nhan doc lap. Vi vay blur quay ve boc ngau
    # nhien bang motion_probability/motion_length_px/motion_angle ben duoi.
    #
    # Danh doi phai ghi ro: khi hai nhanh doc lap, cua so IMU khong mang mot bit
    # nao ve cach anh bi lam mo, nen nhanh IMU khong dong gop duoc gi cho viec
    # khoi phuc ANH; lien ket duy nhat con lai la vector tom tat 128 chieu toan
    # cuc trong fusion. Nhanh IMU van hoc khoi phuc chinh no.
    #
    # Dat true de noi lai hai nhanh: blur khi do la gyro SACH tich phan tren thoi
    # gian phoi sang (qjepa/corruptions/motion.py), da co test va tool kiem chung.
    motion_from_imu: false
    # Chi co tac dung khi motion_from_imu: true (no quyet dinh do dai kernel).
    exposure_seconds: [0.008, 0.030]
    exposure_tracks_darkness: true
    focal_length_px: 128.0     # 640 px @ 90 deg FOV -> f=320, resize 256 -> f=128
    angular_gain: 1.0          # chinh do nang cua blur ma KHONG pha tuong quan IMU
    motion_path_samples: 25
    motion_max_radius_px: 16.0
    # Duong blur dang hoat dong (motion_from_imu: false).
    motion_probability: 0.55
    motion_length_px: [3, 9]
    downsample_probability: 0.32
    downsample_scale: [0.72, 0.96]
    photon_count: [550.0, 4000.0]
    read_noise_std: [0.0027450980, 0.0125490196]
    row_noise_std: [0.0, 0.0039215686]
    hot_pixel_probability: [0.0, 0.00015]
    quantization_bits: [6, 8]
    jpeg_probability: 0.35
    jpeg_quality: [35, 80]
  imu:
    clean_probability: 0.05
    accel_white_noise_std: [0.06, 0.50]
    gyro_white_noise_std: [0.010, 0.060]
    accel_bias_bound: 0.12
    gyro_bias_bound: 0.008
    accel_bias_random_walk: 0.008
    gyro_bias_random_walk: 0.0004
    scale_error_std: 0.006
    cross_axis_std: 0.003
    lowpass_sigma_samples: [0.0, 2.5]
    wander_probability: 0.25
    accel_wander_std: [0.10, 0.60]
    gyro_wander_std: [0.006, 0.040]
    wander_seconds: [0.3, 2.0]
    noise_gain_drift: [0.35, 4.0]
    noise_drift_seconds: 1.5
    quantization_step_accel: [0.0, 0.008]
    quantization_step_gyro: [0.0, 0.0004]
    vibration_tones: [0, 3]
    vibration_frequency_hz: [8.0, 45.0]
    vibration_modulation_hz: [0.2, 1.5]
    accel_vibration_amplitude: [0.0, 0.35]
    gyro_vibration_amplitude: [0.0, 0.02]
    spike_rate_hz: 0.6
    accel_spike_amplitude: [0.7, 3.5]
    gyro_spike_amplitude: [0.06, 0.28]
    dropout_rate_hz: 0.10
    dropout_length_samples: [2, 8]

phase1:
  name: latent_pretrain
  initialization_seed: 73128
  # Neo duy nhat trong phase 1 khong tu quy chieu. Khong co no, JEPA co the dat
  # loss thap tren mot latent da vut bo tin hieu — do dung la ket qua lan truoc.
  decoder_enabled: true
  reconstruction_loss_weight: 0.0          # khong co duong pixel-space
  coefficient_reconstruction_loss_weight: 0.45
  # Ngang voi phase 2. Truoc day la 0.5 trong khi phase 2 la 2.0, tuc ta bat decoder
  # dung lai duong net tu mot latent ma luc hoc gan nhu khong bi hoi ve duong net.
  reconstruction_detail_weight: 2.0
  online_clean_forward_for_regularization: true
  regularized_maps: [FI, FU, ZI, ZU, FI_clean, FU_clean, ZI_clean, ZU_clean]
  jepa_weight: 1.0
  variance_weight: 1.0
  covariance_weight: 0.01
  variance_gamma: 1.0
  variance_eps: 0.0001
  image_positions_per_update: 16
  imu_positions_per_update: 8
  position_seed: 73132
  minimum_statistics_batch: 8
  batch_size: 8
  gradient_accumulation: 1
  learning_rate: 0.0002
  weight_decay: 0.0001
  max_successful_updates: 10000
  warmup_updates: 500
  minimum_lr: 0.000001
  gradient_clip_norm: 5.0
  teacher_momentum_start: 0.99
  teacher_momentum_end: 0.999
  precision: fp32

encoder_sensitivity:
  enabled: true
  target: online_dense_before_fusion
  layer_norm_eps: 0.00001
  image_epsilon: 0.00392156862745098
  imu_normalized_epsilon: 0.01
  alpha: 1.0
  minimum_energy: 1.0e-12
  # Truoc: 1e-4 tren mot so hang co do lon ~1e-2, tuc dong gop bi nuot trong lam
  # tron khi JEPA ~0.65. Khoi Jacobian cu KHONG tac dong gi do duoc — va khong the
  # nang len, vi no phat do nhay DANG HUONG, tuc keo thang ve collapse.
  # So hang moi la log(gain_nhieu / gain_tin_hieu): khong thu nguyen, collapse lam
  # ca hai ve 0 nen ti so dung yen. Vi vay no nang len duoc that.
  # 0.05 la diem xuat phat; doc sensitivity_noise_gain / sensitivity_signal_gain
  # trong log roi chinh, dung giu nguyen vi tin so nay.
  weight_max: 0.05
  # Chan duoi cho log-ratio. Khong co no muc tieu VO HAN DUOI: khong gi ngan
  # optimizer keo ti so ve 0 mai mai, va mot so hang phu khong chan canh tranh voi
  # JEPA qua hang nghin update la cach mot run di lech ma khong ai nhin ra.
  # log(0.02) = -3.912, tuc "dung day them khi encoder da diec gap 50 lan".
  #
  # Do tren 30 update dau, du lieu that (24k sample TartanAir), CPU:
  #   nhanh ANH : ratio 0.05..0.26  -> da nhay voi tin hieu hon nhieu 4..20 lan
  #   nhanh IMU : ratio 1.0..3.3    -> NHAY VOI NHIEU NGANG HOAC HON tin hieu
  # Tuc khoi nay ton tai chu yeu vi nhanh IMU. Dieu do khop voi bat doi xung da
  # biet cua bai toan: anh can THEM tan so cao, IMU can BOT.
  floor_log_ratio: -3.912
  start_after_updates: 500
  ramp_updates: 1000
  probe_seed: 73129

monitor:
  validation_bank_size: 64
  relative_rank_std_warning: 0.10
  raw_scale_ratio_warning: [0.10, 10.0]
  consecutive_warning_checks: 3

phase2:
  name: latent_decoder_train
  backbone_checkpoint: null
  decoder_initialization_seed: 73131
  freeze_backbone: true
  # Skip tu tang trung gian cua encoder. Net di qua duong nay den tu ANH DAU VAO,
  # khong phai tu latent — no lam anh net hon that, nhung "khoi phuc tu latent"
  # khong con mo ta dung he nua. Bat tuong minh, va decoder_input phai noi that.
  encoder_skips: true
  decoder_input: latent_plus_encoder_skips
  # Cong duoc sinh TU DUONG LATENT, nen no phu thuoc tung vi tri va tung kenh:
  # latent quyet dinh cho bao nhieu skip di qua. De false thi merge chi la mot conv
  # pointwise, tuc mot ti le pha tron CO DINH — khong loc duoc gi.
  skip_gating: true
  # Decoder du doan HIEU CHINH tren he so dau vao, head zero-init: update 0
  # tra lai dung input, nen model khong bao gio te hon viec khong lam gi.
  input_coefficient_residual: true
  output_coefficients: input_residual
  # Head doc CA duong latent lan he so dau vao. Khong co no, delta = f(Z) va
  # decoder KHONG BIEU DIEN DUOC phep khu nhieu — muon tru bot nhieu thi phai doc
  # duoc no, ma latent duoc day de vut bo hien thuc cua nhieu. Do duoc: mot bo loc
  # Gauss co dinh giam loss IMU 74,8% (tools/imu_oracle.py), tuc model dang bo lo
  # mot mon loi khong lo vi khong the voi toi.
  residual_sees_input: true
  reconstruction_loss_weight: 1.0
  jepa_loss_weight: 0.0
  sensitivity_loss_weight: 0.0
  batch_size: 4
  gradient_accumulation: 2
  learning_rate: 0.0002
  weight_decay: 0.0001
  max_successful_updates: 5000
  warmup_updates: 250
  minimum_lr: 0.000001
  gradient_clip_norm: 5.0
  reconstruction_detail_weight: 2.0   # phat rieng bang LH/HL/HH va Haar detail
  # Sai so IMU da chuan hoa do duoc la ~0,12-0,14. Voi beta=1.0 toan bo qua trinh
  # train nam trong vung BAC HAI cua SmoothL1, noi gradient = |x|/beta = 0,125 —
  # yeu gap 8 lan L1, va mat luon tinh ben voi spike ma SmoothL1 sinh ra de co.
  smooth_l1_beta: 0.05
  # Phat trên sai phan bac mot: dai luong duy nhat trong bao cao noi ve do MUOT.
  imu_variation_weight: 0.5
  # L1 tren tung he so co trung vi bang 0, nen khi duoc phep cham vao bang chi tiet
  # model chon CO NHO chung — do dung la hanh vi do duoc: LH/HL te di sau khi
  # residual_sees_input cho no quyen cham vao. So hang nay doi TONG nang luong
  # duong net phai bang anh sach, nen co nho vi pham truc tiep. Khop mo-men, khong
  # phai doi khang: khong can mang thu hai, khong co rui ro mat can bang.
  detail_energy_weight: 1.0
  precision: fp32
